name: Auto Release

on:
  push:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Important for fetching tags to calculate distance

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Extract Version from gradle.properties
        id: get_version
        run: |
          VERSION=$(grep "^version=" gradle.properties | cut -d'=' -f2)
          echo "PROJECT_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Detected version: $VERSION"

      - name: Check for existing tag and calculate distance
        id: check_tag
        run: |
          VERSION="${{ env.PROJECT_VERSION }}"
          
          # Check if the tag for the base version exists
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Base version tag v$VERSION exists."
            echo "IS_NEW_VERSION=false" >> $GITHUB_ENV
            
            # Calculate commits since that tag
            COMMITS_SINCE=$(git rev-list v$VERSION..HEAD --count)
            echo "Commits since v$VERSION: $COMMITS_SINCE"
            echo "COMMITS_SINCE=$COMMITS_SINCE" >> $GITHUB_ENV
            
            # Get the latest commit message for the patch description
            COMMIT_MSG=$(git log -1 --pretty=%B)
            # Escape newlines for GitHub Actions environment variable
            COMMIT_MSG="${COMMIT_MSG//'%'/'%25'}"
            COMMIT_MSG="${COMMIT_MSG//$'\n'/'%0A'}"
            COMMIT_MSG="${COMMIT_MSG//$'\r'/'%0D'}"
            echo "COMMIT_MSG=$COMMIT_MSG" >> $GITHUB_ENV

          else
            echo "Tag v$VERSION does not exist. This is a new release."
            echo "IS_NEW_VERSION=true" >> $GITHUB_ENV
          fi

      - name: Create Release (New Version)
        if: env.IS_NEW_VERSION == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "v${{ env.PROJECT_VERSION }}"
          name: "v${{ env.PROJECT_VERSION }}"
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release (Patch/Dev Build)
        if: env.IS_NEW_VERSION == 'false' && env.COMMITS_SINCE != '0'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "v${{ env.PROJECT_VERSION }}-patch.${{ env.COMMITS_SINCE }}"
          name: "v${{ env.PROJECT_VERSION }} - Patch ${{ env.COMMITS_SINCE }}"
          body: |
            **Automated Patch Build**
            Commits since v${{ env.PROJECT_VERSION }}: ${{ env.COMMITS_SINCE }}
            
            Latest commit message:
            ${{ env.COMMIT_MSG }}
          draft: false
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
