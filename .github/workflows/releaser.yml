name: Auto-Release Every Commit

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # CRITICAL: Required to count commits for the patch number

      - name: Extract Metadata
        id: meta
        run: |
          # 1. Get Version from gradle.properties
          VERSION=$(grep "mod_version" gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

          # 2. Get Commit Message (First line only)
          COMMIT_MSG=$(git log -1 --pretty=%s)
          echo "COMMIT_MSG=$COMMIT_MSG" >> $GITHUB_ENV

          # 3. Get Short SHA (For unique Tag ID)
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV

          # 4. Get Patch Number (Commits since version change)
          # Find the commit hash that last touched the 'mod_version' line
          # -l: show long rev, -s: suppress author/time
          VERSION_COMMIT=$(git blame -l -s gradle.properties | grep "mod_version" | awk '{print $1}')
          
          if [ -z "$VERSION_COMMIT" ]; then
            # Fallback to total count if detection fails
            PATCH_NUM=$(git rev-list --count HEAD)
          else
            # Count commits from the version-change commit to HEAD
            # We add 1 so the commit that introduced the version is Patch #1
            SINCE_COUNT=$(git rev-list --count ${VERSION_COMMIT}..HEAD)
            PATCH_NUM=$((SINCE_COUNT + 1))
          fi
          
          echo "PATCH_NUM=$PATCH_NUM" >> $GITHUB_ENV

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew build

      # --- RELEASE 1: The Specific Commit Release ---
      - name: Create Specific Release
        uses: softprops/action-gh-release@v2
        with:
          # Tag must be unique. We use version + commit hash.
          # Example Tag: v0.0.2-a1b2c3d
          tag_name: v${{ env.VERSION }}-${{ env.SHORT_SHA }}
          
          # Release Title Format: 0.0.2 - Patch #55
          # Quotes added to prevent # comment issue
          name: "${{ env.VERSION }} - Patch #${{ env.PATCH_NUM }}"
          
          files: build/libs/*.jar
          draft: false
          prerelease: false
          make_latest: false # Ensure this doesn't override the 'Latest' tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- RELEASE 2: The "Latest" Release ---
      - name: Update 'latest' Tag
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Force move the 'latest' tag to the current commit
          git tag -d latest || true
          git push origin :refs/tags/latest || true
          git tag latest
          git push origin latest

      - name: Publish 'Latest' Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build (v${{ env.VERSION }})
          body: "Latest build of version ${{ env.VERSION }} (Patch #${{ env.PATCH_NUM }})"
          files: build/libs/*.jar
          draft: false
          prerelease: false
          make_latest: true # Marks this as the official "Latest" in GitHub UI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
