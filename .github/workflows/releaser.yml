name: Auto-Release Every Commit

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Metadata
        id: meta
        run: |
          VERSION=$(grep "mod_version" gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

          COMMIT_MSG=$(git log -1 --pretty=%s)
          echo "COMMIT_MSG=$COMMIT_MSG" >> $GITHUB_ENV

          # We still get SHA for metadata, but won't use it for the tag
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV

          VER_LINE=$(grep -n "mod_version" gradle.properties | head -n 1 | cut -d: -f1)
          START_COMMIT=$(git blame -l -L $VER_LINE,$VER_LINE gradle.properties | awk '{print $1}' | tr -d '^')
          
          COUNT=$(git rev-list --count $START_COMMIT..HEAD)
          
          if [ "$COUNT" -eq "0" ]; then
             RELEASE_TITLE="${VERSION} - Release"
             PATCH_NUM=1
          else
             PATCH_NUM=$((COUNT + 1))
             RELEASE_TITLE="${VERSION} - Patch #${PATCH_NUM}"
          fi
          
          echo "PATCH_NUM=$PATCH_NUM" >> $GITHUB_ENV
          echo "RELEASE_TITLE=$RELEASE_TITLE" >> $GITHUB_ENV

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew build

      # --- CONSOLIDATED RELEASE ---
      # Uses the Patch Number in the tag (e.g., v0.0.2.60) to ensure correct sorting.
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          # CHANGED: Tag is now based on VERSION and sequential PATCH_NUM
          tag_name: v${{ env.VERSION }}.${{ env.PATCH_NUM }}
          
          name: "${{ env.RELEASE_TITLE }}"
          files: build/libs/*.jar
          draft: false
          prerelease: false
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update 'latest' Git Tag
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push origin -f latest || true
