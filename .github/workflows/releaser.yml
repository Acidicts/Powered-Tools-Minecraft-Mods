name: Create Release from JAR

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle (debug)
        run: ./gradlew build --stacktrace --info

      - name: Find JAR and extract version
        id: jar_info
        run: |
          JAR_FILE=$(find build/libs -name "powered-tools-*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" -type f | head -n 1)
          
          if [ -z "$JAR_FILE" ]; then
            echo "Error: No JAR file found"
            exit 1
          fi
          
          JAR_NAME=$(basename "$JAR_FILE")
          
          # Extract version from filename (powered-tools-X.X.X.jar)
          VERSION=$(echo "$JAR_NAME" | sed -n 's/powered-tools-\(.*\)\.jar/\1/p')
          
          if [ -z "$VERSION" ]; then
            echo "Error: Could not extract version from filename"
            exit 1
          fi
          
          TAG_NAME="v$VERSION"
          
          echo "jar_file=$JAR_FILE" >> $GITHUB_OUTPUT
          echo "jar_name=$JAR_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "${{ steps.jar_info.outputs.tag_name }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Changelog
        if: steps.check_tag.outputs.exists == 'false'
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.jar_info.outputs.tag_name }}" -m "Release ${{ steps.jar_info.outputs.version }}"
          git push origin "${{ steps.jar_info.outputs.tag_name }}"

      - name: Create Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.jar_info.outputs.tag_name }}
          name: Powered Tools ${{ steps.jar_info.outputs.version }}
          body: ${{ steps.build_changelog.outputs.changelog }}
          files: ${{ steps.jar_info.outputs.jar_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
